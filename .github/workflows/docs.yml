name: Docs

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint*"
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint*"
  workflow_dispatch:

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md" "#third_party/**" "#build/**" "#managed_components/**"
